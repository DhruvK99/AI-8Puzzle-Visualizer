<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automated Test Suite — 8-Puzzle UCS Solver</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="content-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="view-header-title">Automated Verification Suite — 8-Puzzle UCS</h1>
        <p class="view-header-subtitle mb-0">
          Executes unit and integration tests across `js/puzzle.js` and `js/ucs.js`.
        </p>
      </div>
      <a href="../index.html" class="btn-burgundy" style="text-decoration: none;">
        ← Return to Application
      </a>
    </div>

    <div class="academic-panel">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div id="test-summary-banner" class="fw-bold">Running tests...</div>
        <button id="btn-rerun-tests" type="button" class="btn-neutral">↻ Re-run All Tests</button>
      </div>
      <div class="table-responsive">
        <table class="table-academic">
          <thead>
            <tr>
              <th style="width: 90px;">Status</th>
              <th style="width: 28%;">Suite</th>
              <th>Test Assertion</th>
              <th>Diagnostic Details</th>
            </tr>
          </thead>
          <tbody id="test-results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/puzzle.js"></script>
  <script src="../js/ucs.js"></script>
  <script src="test_runner.js"></script>
  <script>
    function renderTests() {
      const summary = TestSuite.runAllTests();
      const banner = document.getElementById('test-summary-banner');
      const tbody = document.getElementById('test-results-tbody');

      banner.textContent = `Test Results: ${summary.passed} / ${summary.total} Passed (${summary.failed} Failed)`;
      banner.style.color = summary.failed === 0 ? 'var(--success-olive)' : 'var(--danger-rust)';

      tbody.innerHTML = '';
      summary.results.forEach((r) => {
        const tr = document.createElement('tr');
        const badgeColor = r.status === 'PASS' ? 'var(--success-olive)' : 'var(--danger-rust)';
        tr.innerHTML = `
          <td><span class="badge-burgundy" style="background:${badgeColor}">${r.status}</span></td>
          <td>${r.suite}</td>
          <td><strong>${r.name}</strong></td>
          <td class="small text-muted">${r.details || 'OK'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('btn-rerun-tests').addEventListener('click', renderTests);
    renderTests();
  </script>
</body>
</html>
